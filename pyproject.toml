[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "annofmt"
version = "0.1.0"
description = "Immutable geometry types (BBox, RBBox, Segm) and utilities for computer-vision annotations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "peachfuzz11", email = "pederh11@gmail.com" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["annotations", "bbox", "bounding-box", "segmentation", "computer-vision", "geometry", "yolo", "coco"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/peachfuzz11/annofmt"
Repository = "https://github.com/peachfuzz11/annofmt"
Issues = "https://github.com/peachfuzz11/annofmt/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/annofmt"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

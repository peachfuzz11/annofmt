[build-system]
requires = ["setuptools", "setuptools-scm", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "annotations"
version = "0.1.0"
description = "A Python package for handling annotations and boxes."
readme = "README.md"
authors = [
    { name = "ph" }
]

requires-python = ">=3.9"
dynamic = ["dependencies", "optional-dependencies"]


keywords = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]


[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
Repository = "https://github.com/peachfuzz11/annotations"



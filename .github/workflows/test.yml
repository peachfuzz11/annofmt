name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: python -c "from annofmt.bbox import BBox; from annofmt.rbbox import RBBox; from annofmt.segm import Segm; print('All imports OK')"
